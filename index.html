<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실험실</title>
<style>
  :root{
    color-scheme:light;
    --bg:#fafaf8;
    --panel:#ffffff;
    --panel-border:#d9d9d2;
    --text:#1c1c1a;
    --muted:#6b6b66;
    --accent:#0f9d87;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:relative;
    z-index:10;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    padding:10px 12px 0;
    border-bottom:1px solid var(--panel-border);
    background:var(--panel);
  }
  .topbar h1{
    font-size:0.95rem;
    font-weight:600;
    color:var(--muted);
    margin:0 14px 8px 4px;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .tabs{
    display:flex;
    gap:4px;
    flex:1 1 auto;
    flex-wrap:wrap;
  }
  .tab{
    appearance:none;
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:var(--sans);
    font-size:0.86rem;
    font-weight:500;
    padding:10px 14px;
    min-height:44px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab:hover{color:var(--text);}
  .tab.active{
    color:var(--text);
    border-bottom-color:var(--accent);
    background:rgba(15,157,135,0.08);
  }
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}

  /* 분류(카테고리) 바 */
  .cats{
    display:flex;
    gap:6px;
    flex:1 1 auto;
    flex-wrap:wrap;
    margin:0 0 8px;
  }
  .cat{
    appearance:none;
    background:transparent;
    border:1px solid var(--panel-border);
    border-radius:999px;
    color:var(--muted);
    font-family:var(--sans);
    font-size:0.82rem;
    font-weight:600;
    padding:0 14px;
    min-height:34px;
    cursor:pointer;
    white-space:nowrap;
  }
  .cat:hover{color:var(--text);}
  .cat.active{
    color:#fff;
    background:var(--accent);
    border-color:var(--accent);
  }
  .cat:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .tabs{flex:1 1 100%;}
  .tab[hidden]{display:none;}

  /* 준비 중 화면 */
  .placeholder{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:6px;
    color:var(--muted);
    background:var(--bg);
    text-align:center;
  }
  .placeholder.active{display:flex;}
  .placeholder strong{font-size:1.05rem;color:var(--text);}
  .placeholder span{font-size:0.88rem;}

  /* 모바일 전용 메뉴 버튼 (데스크톱에서는 숨김) */
  .menu-btn{
    display:none;
    appearance:none;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:rgba(15,157,135,0.08);
    border:1px solid var(--panel-border);
    border-radius:8px;
    color:var(--text);
    font-family:var(--sans);
    font-size:0.86rem;
    font-weight:600;
    padding:0 12px;
    min-height:40px;
    max-width:60%;
    cursor:pointer;
  }
  .menu-btn .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .menu-btn .chev{
    flex:none;
    width:8px;height:8px;
    border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);
    transform:rotate(45deg) translateY(-2px);
    transition:transform .15s;
  }
  .menu-btn[aria-expanded="true"] .chev{transform:rotate(225deg) translateY(-2px);}
  .menu-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  @media (max-width:700px){
    .topbar{
      flex-wrap:wrap;
      justify-content:space-between;
      padding:6px 12px;
    }
    .topbar h1{margin:0 8px 0 4px;order:1;}
    .menu-btn{display:flex;margin-left:auto;order:2;}
    .cats{
      order:3;
      flex:1 1 100%;
      flex-wrap:nowrap;
      overflow-x:auto;
      margin:6px 0 2px;
      padding-bottom:4px;
    }

    /* 탭 목록: 평소엔 숨기고, 열면 화면을 밀지 않고 위에 겹쳐서 표시 */
    .tabs{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      right:0;
      padding:8px 12px 12px;
      background:var(--panel);
      border-bottom:1px solid var(--panel-border);
      box-shadow:0 8px 16px rgba(0,0,0,0.12);
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      max-height:70vh;
      overflow-y:auto;
    }
    .tabs.open{display:grid;}
    .tab{
      border:1px solid var(--panel-border);
      border-radius:8px;
      padding:8px 10px;
      text-align:center;
      white-space:normal;
    }
    .tabs{flex:none;}
    .tab.active{
      border-color:var(--accent);
      border-bottom-color:var(--accent);
    }
  }

  .panes{
    flex:1;
    position:relative;
  }
  iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    background:var(--bg);
    display:none;
  }
  iframe.active{display:block;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>실험실</h1>
    <div class="cats" id="catList" role="tablist" aria-label="분류">
      <button class="cat active" data-cat="optics" role="tab" aria-selected="true">광학/광섬유 일반</button>
      <button class="cat" data-cat="amp" role="tab" aria-selected="false">증폭기</button>
      <button class="cat" data-cat="control" role="tab" aria-selected="false">제어공학</button>
      <button class="cat" data-cat="arduino" role="tab" aria-selected="false">아두이노 및 외부기기</button>
      <button class="cat" data-cat="misc" role="tab" aria-selected="false">기타</button>
    </div>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="tabList">
      <span class="label" id="menuLabel">SMS</span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="tabs" id="tabList" role="tablist">
      <button class="tab active" data-cat="optics" data-target="frame-sms" role="tab" aria-selected="true">SMS</button>
      <button class="tab" data-cat="optics" data-target="frame-prism" role="tab" aria-selected="false">프리즘 모델링</button>
      <button class="tab" data-cat="optics" data-target="frame-gaussian" role="tab" aria-selected="false">Gaussian Beam</button>
      <button class="tab" data-cat="optics" data-target="frame-gaussian-bpm" role="tab" aria-selected="false">Gaussian BPM</button>
      <button class="tab" data-cat="optics" data-target="frame-coupling" role="tab" aria-selected="false">Coupling</button>
      <button class="tab" data-cat="optics" data-target="frame-spgd" role="tab" aria-selected="false">SPGD 2D Coupling</button>
      <button class="tab" data-cat="misc" data-target="frame-stl" role="tab" aria-selected="false">파일 저장소</button>
      <button class="tab" data-cat="misc" data-target="frame-log" role="tab" aria-selected="false">실험 기록</button>
      <button class="tab" data-cat="misc" data-target="frame-paper" role="tab" aria-selected="false">논문</button>
      <button class="tab" data-cat="optics" data-target="frame-lensed-gf" role="tab" aria-selected="false">Lensed GF</button>
      <button class="tab" data-cat="optics" data-target="frame-tec" role="tab" aria-selected="false">TEC Simulator</button>
      <button class="tab" data-cat="optics" data-target="frame-falsecolor" role="tab" aria-selected="false">가상색 스펙트럼</button>
      <button class="tab" data-cat="amp" data-target="frame-amp" role="tab" aria-selected="false">증폭기</button>
      <button class="tab" data-cat="control" data-target="frame-control" role="tab" aria-selected="false">제어공학</button>
      <button class="tab" data-cat="arduino" data-target="frame-arduino" role="tab" aria-selected="false">아두이노 시리얼</button>
    </div>
  </div>

  <div class="panes">
    <iframe id="frame-sms" class="active" src="sms.html" title="SMS"></iframe>
    <iframe id="frame-prism" src="prism.html" title="프리즘 모델링" loading="lazy"></iframe>
    <iframe id="frame-gaussian" src="gaussian.html" title="Gaussian Beam" loading="lazy"></iframe>
    <iframe id="frame-gaussian-bpm" src="Gaussian_BPM_parax.html" title="Gaussian BPM" loading="lazy"></iframe>
    <iframe id="frame-coupling" src="coupling.html" title="Coupling" loading="lazy"></iframe>
    <iframe id="frame-spgd" src="SPGD_2D_coupling.html" title="SPGD 2D Coupling" loading="lazy"></iframe>
    <iframe id="frame-stl" src="storage.html" title="파일 저장소" loading="lazy"></iframe>
    <iframe id="frame-log" src="log.html" title="실험 기록" loading="lazy"></iframe>
    <iframe id="frame-paper" src="index_excel_preview.html" title="논문" loading="lazy"></iframe>
    <iframe id="frame-lensed-gf" src="lensed_GF_simulator__wideangle_.html" title="Lensed GF" loading="lazy"></iframe>
    <iframe id="frame-tec" src="TEC_simulator.html" title="TEC Simulator" loading="lazy"></iframe>
    <iframe id="frame-falsecolor" src="falsecolor_spectrum_viewr.html" title="가상색 스펙트럼" loading="lazy"></iframe>
    <!-- 증폭기: 나중에 <iframe id="frame-amp" src="파일.html" ...>로 교체하면 됨 -->
    <div id="frame-amp" class="placeholder">
      <strong>증폭기</strong>
      <span>준비 중입니다</span>
    </div>
    <iframe id="frame-control" src="PID_Control_sim.html" title="제어공학" loading="lazy"></iframe>
    <!-- Web Serial을 쓰려면 iframe에 allow="serial"이 필요함 -->
    <iframe id="frame-arduino" src="arduino_serial.html" title="아두이노 시리얼" allow="serial" loading="lazy"></iframe>
  </div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const frames = document.querySelectorAll('.panes iframe');
  const tabList = document.getElementById('tabList');
  const menuBtn = document.getElementById('menuBtn');
  const menuLabel = document.getElementById('menuLabel');

  function setMenu(open){
    tabList.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setMenu(!tabList.classList.contains('open'));
  });

  // 메뉴 바깥(탭 목록·버튼 외 영역)을 누르면 닫기
  document.addEventListener('click', (e) => {
    if (!tabList.contains(e.target) && !menuBtn.contains(e.target)) setMenu(false);
  });
  // iframe 안을 눌렀을 때도 닫히도록 (포커스가 iframe으로 넘어가면 window blur 발생)
  window.addEventListener('blur', () => setMenu(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

  const cats = document.querySelectorAll('.cat');
  let currentCat = 'optics';

  function activateTab(tab){
    tabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
    document.querySelectorAll('.panes > iframe, .panes > .placeholder').forEach(f => f.classList.remove('active'));
    tab.classList.add('active');
    tab.setAttribute('aria-selected','true');
    document.getElementById(tab.dataset.target).classList.add('active');
    menuLabel.textContent = tab.textContent.trim();
  }

  function selectCategory(cat){
    currentCat = cat;
    cats.forEach(c => {
      const on = c.dataset.cat === cat;
      c.classList.toggle('active', on);
      c.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    let first = null, activeInCat = null;
    tabs.forEach(t => {
      const inCat = t.dataset.cat === cat;
      t.hidden = !inCat;
      if (inCat && !first) first = t;
      if (inCat && t.classList.contains('active')) activeInCat = t;
    });
    // 이 분류에서 이미 열려 있던 탭이 없으면 첫 탭을 연다
    activateTab(activeInCat || first);
  }

  cats.forEach(c => c.addEventListener('click', () => { selectCategory(c.dataset.cat); }));

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      activateTab(tab);
      setMenu(false);
    });
  });

  selectCategory('optics');
</script>
</body>
</html>
