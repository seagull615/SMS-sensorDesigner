<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파일 저장소</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f9fc;
    --panel-border:#dde3ee;
    --text:#1a2436;
    --muted:#66728a;
    --accent:#3b82f6;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  .page{max-width:1100px;margin:0 auto;padding:32px 20px 48px;}
  header h1{font-size:1.55rem;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em;}
  header p.sub{color:var(--muted);margin:0 0 22px;max-width:62ch;line-height:1.5;font-size:0.95rem;}
  .layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}}

  .filelist{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:10px;display:flex;flex-direction:column;gap:4px;
  }
  .file-item{
    display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:7px;
    cursor:pointer;border:1px solid transparent;
  }
  .file-item:hover{background:rgba(59,130,246,0.05);}
  .file-item.active{background:rgba(59,130,246,0.08);border-color:rgba(59,130,246,0.35);}
  .file-item .name{font-size:0.88rem;font-weight:600;color:var(--text);}
  .file-item .meta{font-size:0.74rem;color:var(--muted);font-family:var(--mono);}

  .stage{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:10px;min-height:320px;display:flex;align-items:center;justify-content:center;
  }
  #photo{
    max-width:100%;max-height:520px;border-radius:6px;display:none;object-fit:contain;
  }
  #photoMsg{
    display:none;color:var(--muted);font-size:0.9rem;text-align:center;line-height:1.6;padding:20px;
  }
  #photoMsg code{font-family:var(--mono);font-size:0.82rem;color:var(--text);}

  .stage-footer{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
    gap:10px;padding:12px 6px 2px;
  }
  .fname{font-family:var(--mono);font-size:0.8rem;color:var(--text);}
  button.primary{
    background:var(--accent);border:1px solid var(--accent);color:#fff;
    padding:8px 14px;border-radius:6px;font-family:var(--sans);font-size:0.82rem;cursor:pointer;
  }
  button.primary:hover{opacity:0.9;}
  #errBox{
    display:none;background:#fef2f2;border:1px solid #fca5a5;color:#c0392b;
    border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:10px;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>파일 저장소</h1>
    <p class="sub">직접 만든 3D 모델(STL)을 모아두는 공간입니다. 목록에서 파일을 고르면 사진을 확인하고 다운로드할 수 있습니다.</p>
  </header>
  <div class="layout">
    <div class="filelist" id="fileList"></div>

    <div>
      <div id="errBox"></div>
      <div class="stage">
        <img id="photo" alt="">
        <div id="photoMsg"></div>
      </div>
      <div class="stage-footer">
        <span class="fname" id="fname">-</span>
        <button class="primary" id="downloadBtn">⬇ 다운로드</button>
      </div>
    </div>
  </div>
</div>

<script>
// 저장소에 등록된 파일 목록.
// file : 다운로드할 STL (index.html과 같은 폴더)
// photo: 사진 경로 — GitHub 사진 폴더 이름에 맞게 아래 PHOTO_DIR만 바꾸면 됩니다.
const PHOTO_DIR = "photos/";   // 예: "photos/", "images/", "사진/" (끝에 / 필수)

const STORED_FILES = [
  { name: "굴절계 (refracmeter)", file: "refracmeter.stl", photo: "refracmeter.png" }
  // 새 항목 추가: { name: "이름", file: "xxx.stl", photo: "xxx.png" }
];

const fileListEl = document.getElementById('fileList');
const fnameEl = document.getElementById('fname');
const errBox = document.getElementById('errBox');
const photoEl = document.getElementById('photo');
const photoMsg = document.getElementById('photoMsg');
const downloadBtn = document.getElementById('downloadBtn');

let current = null;

function showPhoto(entry){
  const src = PHOTO_DIR + entry.photo;
  photoEl.style.display = 'none';
  photoMsg.style.display = 'none';
  photoEl.onload = () => { photoEl.style.display = 'block'; };
  photoEl.onerror = () => {
    photoMsg.style.display = 'block';
    photoMsg.innerHTML = '사진을 불러오지 못했습니다.<br><code>' + src + '</code> 경로에 파일이 있는지 확인해주세요.';
  };
  photoEl.alt = entry.name;
  photoEl.src = src;
}

function select(entry, itemEl){
  document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
  itemEl.classList.add('active');
  current = entry;
  errBox.style.display = 'none';
  fnameEl.textContent = entry.file;
  showPhoto(entry);
}

function renderList(){
  fileListEl.innerHTML = '';
  STORED_FILES.forEach((entry) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = '<span class="name"></span><span class="meta"></span>';
    item.querySelector('.name').textContent = entry.name;
    item.querySelector('.meta').textContent = entry.file;
    item.addEventListener('click', () => select(entry, item));
    fileListEl.appendChild(item);
  });
  const first = fileListEl.querySelector('.file-item');
  if (first) select(STORED_FILES[0], first);
}

downloadBtn.addEventListener('click', async () => {
  if (!current) return;
  const label = downloadBtn.textContent;
  try{
    downloadBtn.textContent = '받는 중...';
    const res = await fetch(current.file);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = current.file;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    errBox.style.display = 'block';
    errBox.textContent = '다운로드 중 오류가 발생했습니다: ' + err.message;
  }finally{
    downloadBtn.textContent = label;
  }
});

renderList();
</script>
</body>
</html>
