<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Progress</title>

<!-- Excel(.xlsx) 읽기 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f7f8fa;
  --panel:#ffffff;
  --border:#dfe3ea;
  --text:#1a2233;
  --muted:#6b7688;
  --accent:#0f9d8a;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Noto Sans KR","Malgun Gothic",sans-serif;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
}

.wrap{
  width:min(1200px,94%);
  margin:auto;
  padding:36px 0 60px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

h1{
  margin:0;
  font-size:1.35rem;
  font-weight:600;
}

.status{
  color:var(--muted);
  font-size:.82rem;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}

.toolbar{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.sheet-btn{
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  border-radius:7px;
  padding:7px 11px;
  cursor:pointer;
  font-family:inherit;
  font-size:.82rem;
}

.sheet-btn:hover{
  border-color:var(--accent);
}

.sheet-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

.table-wrap{
  overflow:auto;
  max-height:75vh;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:.84rem;
  white-space:nowrap;
}

th,td{
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
  padding:10px 12px;
  text-align:left;
}

th{
  position:sticky;
  top:0;
  z-index:2;
  background:#f7f8fa;
  font-weight:600;
}

tr:last-child td{
  border-bottom:0;
}

th:last-child,
td:last-child{
  border-right:0;
}

.empty{
  padding:30px;
  color:var(--muted);
  text-align:center;
}

.error{
  padding:30px;
  color:#d64545;
  line-height:1.6;
}
</style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>논문 작업 현황</h1>
    <div class="status" id="status">Excel 불러오는 중...</div>
  </header>

  <section class="panel">
    <div class="toolbar" id="sheetTabs"></div>

    <div class="table-wrap">
      <table id="excelTable"></table>
      <div class="empty" id="empty" style="display:none;">
        표시할 데이터가 없습니다.
      </div>
      <div class="error" id="error" style="display:none;"></div>
    </div>
  </section>

</div>

<script>
/*
 * GitHub Repository 구조
 *
 * /
 * ├─ index.html
 * └─ excel/
 *    └─ paper_progress_ripository_linked.xlsx
 */
const EXCEL_PATH = "./excel/paper_progress_ripository_linked.xlsx";

let workbook = null;

async function loadExcel(){

  const status = document.getElementById("status");
  const error = document.getElementById("error");

  try{

    const response = await fetch(EXCEL_PATH, {
      cache: "no-store"
    });

    if(!response.ok){
      throw new Error(
        "Excel 파일을 불러오지 못했습니다. HTTP " +
        response.status
      );
    }

    const buffer = await response.arrayBuffer();

    workbook = XLSX.read(buffer, {
      type: "array",
      cellDates: true
    });

    status.textContent =
      workbook.SheetNames.length + "개 시트";

    renderSheetTabs();

    // 첫 번째 시트 표시
    if(workbook.SheetNames.length > 0){
      renderSheet(workbook.SheetNames[0]);
    }

  }catch(e){

    status.textContent = "불러오기 실패";
    error.style.display = "block";
    error.textContent =
      "Excel 파일을 읽을 수 없습니다.\n\n" + e.message;
  }
}


function renderSheetTabs(){

  const tabs = document.getElementById("sheetTabs");
  tabs.innerHTML = "";

  workbook.SheetNames.forEach((sheetName,index)=>{

    const button = document.createElement("button");

    button.className =
      "sheet-btn" + (index === 0 ? " active" : "");

    button.textContent = sheetName;

    button.onclick = ()=>{

      document
        .querySelectorAll(".sheet-btn")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

      renderSheet(sheetName);
    };

    tabs.appendChild(button);
  });
}


function renderSheet(sheetName){

  const table = document.getElementById("excelTable");
  const empty = document.getElementById("empty");
  const error = document.getElementById("error");

  table.innerHTML = "";
  empty.style.display = "none";
  error.style.display = "none";

  const worksheet = workbook.Sheets[sheetName];

  const data = XLSX.utils.sheet_to_json(
    worksheet,
    {
      header: 1,
      defval: "",
      raw: false
    }
  );

  if(!data.length){
    empty.style.display = "block";
    return;
  }

  /*
   * 첫 번째 행 = Excel의 헤더
   * 두 번째 행부터 = 데이터
   */
  const header = data[0];
  const rows = data.slice(1);

  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  header.forEach(value=>{

    const th = document.createElement("th");
    th.textContent = value;
    headerRow.appendChild(th);

  });

  thead.appendChild(headerRow);
  table.appendChild(thead);


  const tbody = document.createElement("tbody");

  rows.forEach(row=>{

    const tr = document.createElement("tr");

    header.forEach((_,index)=>{

      const td = document.createElement("td");
      td.textContent =
        row[index] !== undefined ? row[index] : "";

      tr.appendChild(td);

    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
}


loadExcel();
</script>

</body>
</html>
